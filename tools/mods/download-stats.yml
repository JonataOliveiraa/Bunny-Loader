# Copiado pelo tools/mods/publish.py para .github/workflows/ do repositório de
# mods. Soma os downloads das Releases de cada mod (download_stats.py) e grava
# stats.json, que o app lê para Populares. Commit só quando um número muda.
name: Download stats

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-stats

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      # Só o que o script lê: o repositório guarda as vitrines e os ports.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            index.json
            stats.json
          sparse-checkout-cone-mode: false
      - name: Count downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/download_stats.py .
      - name: Commit stats.json
        run: |
          if [ -z "$(git status --porcelain -- stats.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git commit -m "Downloads"
          # Uma publicação pode ter entrado no meio: refaz por cima e tenta de novo.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
