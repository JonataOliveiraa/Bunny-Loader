<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="preload" href="art/bunny.ttf" as="font" type="font/ttf" crossorigin>
<title>BL Catalog</title>
<style>
  @font-face { font-family: "Bunny"; src: url("art/bunny.ttf"); font-display: swap; }
  /* A paleta do launcher (app/.../ui/Palette.kt): os azuis dos painéis do Terraria,
     o amarelo só no toque e no que está selecionado, o verde e o vermelho do jogo. */
  :root {
    --night: #0d0f1a;
    --outline: #131625;
    --frame: #1a1e39;
    --frame-2: #222850;
    --panel: #2b335a;
    --frame-border: #4e5275;
    --title: #4a5daa;
    --button: #323471;
    --button-on: #717bd5;
    --select: #252d5c;
    --game: #3f5297;
    --yellow: #f9e141;
    --yellow-soft: #ebe27f;
    --text: #ffffff;
    --dim: #d5daf2;
    --muted: #a6aed6;
    --faint: #7c85b6;
    --accent: #8f98e8;
    --good: #3f8f4e;
    --good-hi: #74e65b;
    --bad: #e0603f;
    --bad-hi: #ff8a6b;
    --gold: #a9822c;
    --gold-hi: #e8c35a;
    --mono: ui-monospace, "Roboto Mono", "Droid Sans Mono", "DejaVu Sans Mono", monospace;
    --sans: system-ui, Roboto, "Segoe UI", sans-serif;
    --pixel: "Bunny", var(--sans);
    --ink: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;
    --radius: 6px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--night); color: var(--text); }
  body {
    font: 14px/1.45 var(--sans);
    -webkit-tap-highlight-color: transparent;
    padding-bottom: calc(46px + env(safe-area-inset-bottom));
  }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .pixel { font-family: var(--pixel); letter-spacing: .02em; text-shadow: var(--ink); }
  img.px { image-rendering: pixelated; flex: none; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .45; }
  svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ------------------------------------------------ topo */
  header.top {
    position: sticky; top: 0; z-index: 5;
    background: var(--frame);
    border-bottom: 2px solid var(--outline);
  }
  .bar { display: flex; align-items: center; gap: 12px; padding: 9px 16px; }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1; }
  .brand img { width: 34px; height: 34px; }
  .brand .title { font-size: 21px; line-height: 1.1; }
  .brand .sub { color: var(--faint); font-size: 11px; }
  .seg { display: flex; border: 1px solid var(--frame-border); border-radius: var(--radius); overflow: hidden; background: var(--night); }
  .seg button { background: none; border: 0; padding: 5px 9px; font: 600 11px var(--mono); color: var(--faint); }
  .seg button.on { background: var(--title); color: var(--text); }
  .icon-btn {
    width: 36px; height: 36px; display: grid; place-items: center;
    background: var(--button); border: 1px solid var(--frame-border); border-radius: var(--radius);
  }
  .icon-btn:active:not(:disabled) { background: var(--button-on); border-color: var(--yellow-soft); }
  .icon-btn img { width: 20px; height: 20px; }
  .busy .icon-btn.sync img { animation: spin 1s steps(8) infinite; }
  @keyframes spin { to { transform: rotate(-360deg); } }
  .progress { height: 2px; overflow: hidden; position: relative; }
  .busy .progress::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 35%;
    background: var(--yellow); animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide { from { left: -35%; } to { left: 100%; } }

  /* ------------------------------------------------ painel de estado */
  .status {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
    background: var(--panel); border-bottom: 1px solid var(--panel);
  }
  .cell { background: var(--night); padding: 7px 12px 8px; min-width: 0; }
  .cell .k { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
  .cell .v { display: flex; align-items: center; gap: 6px; font: 12.5px var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; background: var(--frame-border); flex: none; }
  .dot.ok { background: var(--good-hi); }
  .dot.warn { background: var(--gold-hi); }
  .dot.err { background: var(--bad); }
  .dot.info { background: var(--button-on); }
  @media (min-width: 720px) { .status { grid-template-columns: repeat(6, 1fr); } }

  /* ------------------------------------------------ abas */
  nav.tabs { display: flex; padding: 0 8px; border-bottom: 1px solid var(--panel); background: var(--night); overflow-x: auto; scrollbar-width: none; }
  nav.tabs button {
    background: none; border: 0; padding: 10px 8px 9px; color: var(--muted); font-weight: 500; font-size: 13.5px;
    border-bottom: 3px solid transparent; display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  nav.tabs button img { width: 20px; height: 20px; object-fit: contain; opacity: .8; }
  /* Os ícones de 60 px do launcher têm margem dentro do desenho: maiores, para casar com os de 16 e 32. */
  nav.tabs button img.pad { width: 34px; height: 34px; margin: -7px; }
  nav.tabs .tl { display: inline-flex; align-items: center; gap: 5px; }
  nav.tabs button.on { color: var(--text); border-bottom-color: var(--yellow); }
  nav.tabs button.on img { opacity: 1; }
  @media (max-width: 559px) {
    nav.tabs { display: grid; grid-template-columns: repeat(4, 1fr); padding: 0; }
    nav.tabs button { flex-direction: column; gap: 3px; padding: 8px 2px 6px; font-size: 12.5px; }
  }
  .count { font: 600 10.5px var(--mono); padding: 1px 6px; border-radius: 3px; background: var(--panel); color: var(--dim); }
  .count.err { background: var(--bad); color: #fff; }

  main { padding: 14px 16px 24px; max-width: 980px; margin: 0 auto; }
  section[hidden] { display: none; }

  /* ------------------------------------------------ peças */
  .card { background: var(--frame); border: 1px solid var(--panel); border-radius: var(--radius); }
  .card + .card { margin-top: 12px; }
  .card-h {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: linear-gradient(var(--frame-2), var(--frame-2)); border-bottom: 1px solid var(--panel);
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .card-h .lbl { font-family: var(--pixel); font-size: 16px; text-shadow: var(--ink); letter-spacing: .02em; }
  .card-h .grow { flex: 1; }
  .card-b { padding: 10px 12px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 8px 13px; border-radius: var(--radius); border: 1px solid var(--frame-border); background: var(--button);
    font-weight: 500; font-size: 13.5px;
  }
  .btn:active:not(:disabled) { background: var(--button-on); border-color: var(--yellow-soft); }
  .btn.primary { background: var(--good); border-color: var(--good-hi); }
  .btn.danger { color: var(--bad-hi); border-color: var(--bad); background: rgba(224, 96, 63, .12); }
  .btn.small { padding: 5px 9px; font-size: 12px; }
  .btn img { width: 16px; height: 16px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .badge { font: 700 10.5px var(--mono); letter-spacing: .05em; padding: 3px 7px; border-radius: 3px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
  .badge.new { background: var(--title); }
  .badge.newer { background: var(--good); }
  .badge.same { background: var(--panel); color: var(--dim); }
  .badge.changed, .badge.older { background: var(--gold); }

  dl.kv { display: grid; grid-template-columns: minmax(96px, 34%) 1fr; margin: 0; }
  dl.kv dt, dl.kv dd { padding: 6px 0; border-top: 1px solid var(--panel); margin: 0; min-width: 0; }
  dl.kv dt { color: var(--muted); font-size: 12.5px; padding-right: 10px; }
  dl.kv dd { font: 12.5px var(--mono); color: var(--dim); overflow-wrap: anywhere; display: flex; align-items: flex-start; gap: 6px; }
  dl.kv > :nth-child(1), dl.kv > :nth-child(2) { border-top: 0; }
  dl.kv dd .val { flex: 1; min-width: 0; }
  .copy { background: none; border: 0; padding: 0 2px; color: var(--faint); display: inline-grid; place-items: center; }
  .copy svg { width: 15px; height: 15px; }
  .copy.done { color: var(--good-hi); }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .ok-t { color: var(--good-hi); }
  .warn-t { color: var(--gold-hi); }
  .err-t { color: var(--bad-hi); }

  /* ------------------------------------------------ catálogo */
  .summary { display: flex; gap: 6px 14px; flex-wrap: wrap; color: var(--muted); margin-bottom: 10px; }
  .summary b { color: var(--text); font-weight: 600; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
  .search { flex: 1; position: relative; }
  .search img { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; }
  .search input, select {
    width: 100%; background: var(--select); border: 1px solid var(--frame-border); border-radius: var(--radius);
    padding: 8px 10px 8px 34px; outline: none;
  }
  select { width: auto; padding: 8px 10px; }
  .search input::placeholder { color: var(--faint); }
  .search input:focus, select:focus { border-color: var(--yellow-soft); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  .chip { background: var(--frame); border: 1px solid var(--panel); border-radius: 3px; padding: 4px 10px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .chip.on { color: var(--text); border-color: var(--yellow-soft); background: var(--title); }
  .chip .n { font-family: var(--mono); color: var(--faint); margin-left: 5px; }
  .chip.on .n { color: var(--dim); }

  .list { border: 1px solid var(--panel); border-radius: var(--radius); overflow: hidden; background: var(--frame); }
  .mod + .mod { border-top: 1px solid var(--panel); }
  .mod-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: none; border: 0; text-align: left; }
  .mod.open .mod-head { background: var(--panel); }
  .ico { width: 42px; height: 42px; border-radius: 4px; background: var(--frame-2); border: 1px solid var(--frame-border); flex: none; object-fit: contain; image-rendering: pixelated; }
  .ico.ph { display: grid; place-items: center; font: 700 13px var(--mono); color: var(--faint); }
  .mod-main { flex: 1; min-width: 0; }
  .mod-name { font-weight: 600; display: flex; align-items: center; gap: 7px; min-width: 0; }
  .mod-name .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mod-name .ver { color: var(--accent); font-weight: 400; flex: none; }
  .mod-name img { width: 14px; height: 14px; }
  .mod-meta { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; display: flex; align-items: center; gap: 0; }
  .mod-side { flex: none; display: flex; align-items: center; gap: 5px; color: var(--dim); }
  .mod-side img { width: 12px; height: 12px; }
  .chev { width: 12px; height: 12px; opacity: .7; transition: transform .15s; }
  .mod.open .chev { transform: rotate(90deg); }
  .mod-body { padding: 4px 12px 12px; background: var(--frame-2); border-top: 1px solid var(--panel); }
  .mod-body p { margin: 8px 0 10px; color: var(--muted); }
  .mod-body .actions { margin-top: 10px; }
  .empty { padding: 28px 12px; text-align: center; color: var(--faint); display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .sun {
    width: 52px; height: 54px; image-rendering: pixelated;
    background: url("art/spr_loading.png") 0 0 / 52px 1028px no-repeat;
    animation: sun 1.14s steps(19) infinite;
  }
  @keyframes sun { to { background-position: 0 -1026px; } }

  /* ------------------------------------------------ publicar */
  .drop {
    display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
    padding: 24px 16px; border: 2px dashed var(--frame-border); border-radius: var(--radius);
    background: var(--frame); cursor: pointer;
  }
  .drop:active { border-color: var(--yellow-soft); }
  .drop img { width: 40px; height: 40px; }
  .drop .t { font-family: var(--pixel); font-size: 18px; text-shadow: var(--ink); }
  .drop .h { color: var(--muted); font-size: 12.5px; max-width: 420px; }
  .report { margin-top: 14px; }
  .rep-head { display: flex; gap: 12px; align-items: center; padding: 12px; }
  .rep-head .ico { width: 52px; height: 52px; }
  .rep-head .nm { font-weight: 600; font-size: 15px; }
  .rep-note { padding: 0 12px 12px; color: var(--muted); }
  table.cmp { width: 100%; border-collapse: collapse; font: 12.5px var(--mono); table-layout: fixed; color: var(--dim); }
  table.cmp th { text-align: left; font: 500 11px var(--sans); text-transform: uppercase; letter-spacing: .06em; color: var(--faint); padding: 6px 0; }
  table.cmp td { padding: 6px 8px 6px 0; border-top: 1px solid var(--panel); overflow-wrap: anywhere; vertical-align: top; }
  table.cmp td:first-child { color: var(--muted); font-family: var(--sans); width: 26%; }
  table.cmp .diff { color: var(--gold-hi); }
  ul.files { list-style: none; margin: 0; padding: 0; font: 12px var(--mono); color: var(--muted); columns: 2; column-gap: 16px; }
  ul.files li { padding: 2px 0; overflow-wrap: anywhere; break-inside: avoid; }
  ul.warns { margin: 0; padding: 0; list-style: none; }
  ul.warns li { display: flex; gap: 8px; padding: 6px 0; color: var(--gold-hi); font-size: 13px; }
  ul.warns li + li { border-top: 1px solid var(--panel); }
  ul.warns svg { width: 16px; height: 16px; margin-top: 1px; }
  .note { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }

  /* ------------------------------------------------ console */
  .log-entry + .log-entry { border-top: 1px solid var(--panel); }
  .log-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; }
  .log-title { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log-meta { color: var(--faint); flex: none; }
  pre.log {
    margin: 0; padding: 8px 12px 10px; background: var(--night); border-top: 1px solid var(--panel);
    font: 11.5px/1.55 var(--mono); color: var(--dim); white-space: pre-wrap; overflow-wrap: anywhere;
  }
  pre.log .e { color: var(--bad-hi); }

  /* ------------------------------------------------ rodapé */
  footer.last {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: var(--frame); border-top: 2px solid var(--outline);
    font: 12px var(--mono); color: var(--muted); cursor: pointer;
  }
  footer.last .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  dialog { background: var(--frame); color: var(--text); border: 1px solid var(--frame-border); border-radius: 8px; padding: 0; width: min(420px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(5, 6, 12, .7); }
  dialog .d-b { padding: 16px; }
  dialog h3 { margin: 0 0 8px; font: 18px var(--pixel); text-shadow: var(--ink); letter-spacing: .02em; }
  dialog p { margin: 0 0 12px; color: var(--muted); }
  dialog .d-a { padding: 12px 16px; border-top: 1px solid var(--panel); }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand">
      <img class="px" src="art/ic_bunny_head.png" alt="">
      <div>
        <div class="title pixel" data-t="app.title"></div>
        <div class="sub mono" id="appVer">—</div>
      </div>
    </div>
    <div class="seg" id="langSeg">
      <button data-lang="en">EN</button>
      <button data-lang="pt">PT</button>
    </div>
    <button class="icon-btn sync" id="syncBtn" data-action><img class="px" src="art/ic_refresh.png" alt=""></button>
  </div>
  <div class="progress"></div>
</header>
<div class="status" id="status"></div>

<nav class="tabs" id="tabs">
  <button data-tab="catalog"><img class="px pad" src="art/ic_tab_pacotes.png" alt=""><span class="tl"><span data-t="tab.catalog"></span><span class="count" id="countCatalog">0</span></span></button>
  <button data-tab="publish"><img class="px" src="art/ic_folder.png" alt=""><span class="tl"><span data-t="tab.publish"></span></span></button>
  <button data-tab="console"><img class="px" src="art/ic_js.png" alt=""><span class="tl"><span data-t="tab.console"></span><span class="count" id="countConsole">0</span></span></button>
  <button data-tab="system"><img class="px pad" src="art/ic_config.png" alt=""><span class="tl"><span data-t="tab.system"></span></span></button>
</nav>

<main>
  <section id="tab-catalog">
    <div class="summary mono" id="catSummary"></div>
    <div class="toolbar">
      <label class="search">
        <img class="px" src="art/ic_lupa.png" alt="">
        <input id="search" type="search" autocomplete="off" spellcheck="false">
      </label>
      <select id="sort">
        <option value="name"></option>
        <option value="downloads"></option>
        <option value="size"></option>
        <option value="category"></option>
        <option value="updated"></option>
      </select>
    </div>
    <div class="chips" id="chips"></div>
    <div class="list" id="modList"></div>
  </section>

  <section id="tab-publish" hidden>
    <label class="drop" for="file">
      <img class="px" src="art/ic_folder.png" alt="">
      <span class="t" data-t="pub.pick"></span>
      <span class="h" data-t="pub.pickHint"></span>
    </label>
    <input type="file" id="file" hidden>
    <div class="report" id="report"></div>
  </section>

  <section id="tab-console" hidden>
    <div class="card">
      <div class="card-h"><span class="grow lbl" data-t="con.title"></span><button class="btn small" id="clearLog" data-t="con.clear"></button></div>
      <div id="logList"></div>
    </div>
  </section>

  <section id="tab-system" hidden>
    <div id="sysInfo"></div>
  </section>
</main>

<footer class="last" id="last"><span class="dot" id="lastDot"></span><span class="txt" id="lastTxt"></span><span id="lastMeta"></span></footer>

<dialog id="confirm">
  <div class="d-b">
    <h3 id="cfTitle"></h3>
    <p id="cfBody"></p>
    <dl class="kv" id="cfInfo"></dl>
  </div>
  <div class="d-a actions">
    <button class="btn" id="cfNo" data-t="dlg.cancel"></button>
    <button class="btn danger" id="cfYes"></button>
  </div>
</dialog>

<script>
"use strict";

// ------------------------------------------------------------ textos
const I18N = {

function storedLang() {
  try { return localStorage.getItem("bl.lang"); } catch { return null; }
}
let lang = storedLang() || ((navigator.language || "").toLowerCase().startsWith("pt") ? "pt" : "en");

function t(key, vars) {
  let s = I18N[lang][key] ?? I18N.en[key] ?? key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");
  return s;
}

// ------------------------------------------------------------ utilidades
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const locale = () => (lang === "pt" ? "pt-BR" : "en-US");
const num = (n) => Number(n || 0).toLocaleString(locale());
function bytes(n) {
  n = Number(n || 0);
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(2) + " MB";
}
const clock = (ms) => ms ? new Date(ms).toLocaleTimeString(locale(), { hour12: false }) : "—";
function ago(ms) {
  if (!ms) return "—";
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 5) return t("ago.now");
  if (s < 60) return t("ago.s", { n: s });
  if (s < 3600) return t("ago.m", { n: Math.floor(s / 60) });
  return t("ago.h", { n: Math.floor(s / 3600) });
}
const short = (sha, n = 7) => sha ? String(sha).slice(0, n) : "—";

const px = (name, cls = "") => `<img class="px ${cls}" src="art/${name}.png" alt="">`;
const ICON = {
  chev: px("ic_seta_dir", "chev"),
  trash: px("ic_trash"),
  dry: px("ic_sec_util"),
  send: px("ic_start"),
  x: px("ic_fechar"),
  star: px("ic_fav_on"),
  dl: px("ic_download"),
  copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>',
  warn: '<svg viewBox="0 0 24 24"><path d="M12 3 2 21h20z"/><path d="M12 10v4M12 17.5v.5"/></svg>',
};

function copyBtn(value) {
  return `<button class="copy" data-copy="${esc(value)}" title="${esc(t("act.copy"))}">${ICON.copy}</button>`;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return; } catch { /* WebView sem permissão: o jeito antigo */ }
  const area = document.createElement("textarea");
  area.value = text;
  document.body.appendChild(area);
  area.select();
  document.execCommand("copy");
  area.remove();
}
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  e.stopPropagation();
  await copyText(b.dataset.copy);
  b.classList.add("done");
  b.innerHTML = ICON.check;
  setTimeout(() => { b.classList.remove("done"); b.innerHTML = ICON.copy; }, 1400);
});

// O nome do mod na língua da página, quando o manifesto traz (localizedNames).
function modName(m) {
  const names = (m.manifest && m.manifest.localizedNames) || {};
  return names[lang === "pt" ? "pt-BR" : "en-US"] || m.name || m.id || m.uid;
}
function gameRange(v) {
  if (!Array.isArray(v) || !v.length) return "—";
  return v[0] === v[v.length - 1] ? String(v[0]) : `${v[0]} – ${v[v.length - 1]}`;
}
function depList(d) {
  if (!Array.isArray(d) || !d.length) return "—";
  return d.map((x) => typeof x === "string" ? x : (x.id || x.uid || x.name || JSON.stringify(x))).join(", ");
}
function iconHtml(src, label, cls = "") {
  const letters = String(label || "?").replace(/[^A-Za-z0-9]/g, "").slice(0, 2).toUpperCase() || "?";
  if (!src) return `<div class="ico ph ${cls}">${esc(letters)}</div>`;
  return `<img class="ico ${cls}" src="${esc(src)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;ico ph ${cls}&quot;>${esc(letters)}</div>'">`;
}
function kv(rows) {
  return `<dl class="kv">${rows.filter(Boolean).map(([k, v, copy]) =>
    `<dt>${esc(k)}</dt><dd><span class="val">${v}</span>${copy ? copyBtn(copy) : ""}</dd>`).join("")}</dl>`;
}

// ------------------------------------------------------------ ponte com o app
const NATIVE = window.BLNative || null;
const pending = new Map();
let nextCall = 1;
window.__blReply = (id, json) => {
  const resolve = pending.get(id);
  pending.delete(id);
  if (resolve) resolve(JSON.parse(json));
};

function api(path, body = {}) {
  if (!NATIVE) return Promise.resolve({ ok: false, error: t("err.noApp"), log: "" });
  const id = nextCall++;
  return new Promise((resolve) => {
    pending.set(id, resolve);
    NATIVE.post(id, path, JSON.stringify({ ...body, lang }));
  });
}

function fileBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

// ------------------------------------------------------------ estado
const state = {
  data: null,
  upload: null,
  filter: "",
  category: "",
  sort: "name",
  open: new Set(),
  tab: "catalog",
  log: [],
  running: null,
};

/** Uma operação por vez: trava os botões, guarda o registro e mostra no rodapé. */
async function task(title, path, body) {
  state.running = title;
  document.body.classList.add("busy");
  document.querySelectorAll("[data-action]").forEach((b) => (b.disabled = true));
  renderLast();
  if (!state.data) renderCatalog();
  const at = Date.now();
  let r;
  try {
    r = await api(path, body);
  } catch (e) {
    r = { ok: false, error: String(e), log: "" };
  }
  state.running = null;
  document.body.classList.remove("busy");
  state.log.unshift({ title, at, ok: !!r.ok, ms: r.ms ?? (Date.now() - at), log: (r.log || "").trim(), error: r.error });
  renderLog();
  renderLast();
  renderActions();
  return r;
}

async function refresh(title) {
  const r = await task(title || t("op.load"), "/api/state");
  if (r.ok) state.data = r.result;
  render();
  return r;
}

function canWrite() {
  const c = state.data && state.data.credential;
  return !!(c && c.valid && c.push);
}

// ------------------------------------------------------------ desenho
function applyStatic() {
  document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
  document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t(el.dataset.t)));
  $("search").placeholder = t("cat.search");
  for (const o of $("sort").options) o.textContent = t("sort." + o.value);
  document.querySelectorAll("#langSeg button").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
}

function render() {
  applyStatic();
  renderStatus();
  renderCatalog();
  renderReport();
  renderLog();
  renderSystem();
  renderLast();
  renderActions();
}

function renderActions() {
  const busy = !!state.running;
  document.querySelectorAll("[data-action]").forEach((b) => {
    b.disabled = busy || (b.dataset.action === "write" && !canWrite());
  });
}

function credentialView(c) {
  if (!c || !c.present) return ["err", t("key.missing")];
  if (c.offline) return ["warn", t("key.offline")];
  if (c.valid === false) return ["err", t("key.rejected")];
  if (c.error) return ["warn", t("key.error")];
  return ["ok", t("key.valid")];
}

function renderStatus() {
  const d = state.data;
  const c = d && d.credential;
  const r = d && d.remote;
  const n = d && d.traffic;
  const [keyCls, keyTxt] = d ? credentialView(c) : ["", "—"];
  const write = !c || c.push === undefined ? ["", "—"] : c.push ? ["ok", t("yes")] : ["err", t("no")];
  const lat = n && n.latencyMs >= 0 ? [n.latencyMs < 400 ? "ok" : n.latencyMs < 1200 ? "warn" : "err", n.latencyMs + " ms"] : ["", "—"];
  const quota = n && n.quotaLimit > 0
    ? [n.quotaRemaining / n.quotaLimit < 0.1 ? "warn" : "ok", `${num(n.quotaRemaining)}/${num(n.quotaLimit)}`] : ["", "—"];
  const head = r ? (r.source === "public" ? ["warn", t("public")] : ["info", short(r.commit)]) : ["", "—"];
  const cells = [
    ["st.key", keyCls, keyTxt],
    ["st.write", write[0], write[1]],
    ["st.head", head[0], head[1]],
    ["st.latency", lat[0], lat[1]],
    ["st.quota", quota[0], quota[1]],
    ["st.synced", r ? "ok" : "", r ? `<span id="syncAgo">${esc(ago(r.fetchedAt))}</span>` : "—"],
  ];
  $("status").innerHTML = cells.map(([k, cls, v]) =>
    `<div class="cell"><div class="k">${esc(t(k))}</div><div class="v"><span class="dot ${cls}"></span>${k === "st.synced" ? v : esc(v)}</div></div>`).join("");
  $("appVer").textContent = d ? `v${d.app.version} · build ${d.app.build} · bl ${d.app.blVersion}` : "—";
}

function filteredMods() {
  const mods = (state.data && state.data.catalog) || [];
  const q = state.filter.trim().toLowerCase();
  let out = mods.filter((m) => {
    if (state.category && (m.category || "—") !== state.category) return false;
    if (!q) return true;
    return [modName(m), m.name, m.id, m.uid, m.authors, m.category].some((v) => String(v || "").toLowerCase().includes(q));
  });
  const coll = new Intl.Collator(locale(), { sensitivity: "base" });
  const size = (m) => Number((m.download && m.download.size) || 0);
  const updated = (m) => String((m.manifest && m.manifest.updated) || "");
  const downloads = (m) => Number(m.downloads || 0);
  const sorters = {
    name: (a, b) => coll.compare(modName(a), modName(b)),
    downloads: (a, b) => downloads(b) - downloads(a) || coll.compare(modName(a), modName(b)),
    size: (a, b) => size(b) - size(a),
    category: (a, b) => coll.compare(a.category || "", b.category || "") || coll.compare(modName(a), modName(b)),
    updated: (a, b) => updated(b).localeCompare(updated(a)) || coll.compare(modName(a), modName(b)),
  };
  return out.sort(sorters[state.sort] || sorters.name);
}

function renderCatalog() {
  const d = state.data;
  const mods = (d && d.catalog) || [];
  $("countCatalog").textContent = mods.length;
  if (!d) {
    $("catSummary").innerHTML = "";
    $("chips").innerHTML = "";
    $("modList").innerHTML = state.running
      ? `<div class="empty"><div class="sun"></div>${esc(t("cat.loading"))}</div>`
      : `<div class="empty">${esc(t("err.noApp"))}</div>`;
    return;
  }
  const total = mods.reduce((s, m) => s + Number((m.download && m.download.size) || 0), 0);
  const cats = new Map();
  mods.forEach((m) => cats.set(m.category || "—", (cats.get(m.category || "—") || 0) + 1));
  const storeFiles = mods.reduce((s, m) => s + ((m.files && m.files.length) || 0), 0);
  const featured = mods.filter((m) => m.featured).length;
  $("catSummary").innerHTML = `<span><b>${mods.length}</b> ${esc(t("cat.mods"))}</span>` +
    `<span><b>${num(d.stats && d.stats.total)}</b> ${esc(t("cat.downloads"))}</span>` +
    `<span><b>${bytes(total)}</b> ${esc(t("cat.total"))}</span>` +
    `<span><b>${cats.size}</b> ${esc(t("cat.categories"))}</span>` +
    `<span><b>${featured}</b> ${esc(t("cat.featured"))}</span>` +
    `<span><b>${storeFiles}</b> ${esc(t("cat.files"))}</span>`;

  const chip = (value, label, n) =>
    `<button class="chip ${state.category === value ? "on" : ""}" data-cat="${esc(value)}">${esc(label)}<span class="n">${n}</span></button>`;
  $("chips").innerHTML = chip("", t("cat.all"), mods.length) +
    [...cats.entries()].sort((a, b) => b[1] - a[1]).map(([c, n]) => chip(c, c, n)).join("");
  document.querySelectorAll("[data-cat]").forEach((b) => (b.onclick = () => { state.category = b.dataset.cat; renderCatalog(); }));

  const shown = filteredMods();
  if (!shown.length) {
    $("modList").innerHTML = `<div class="empty">${esc(mods.length ? t("cat.empty") : t("cat.emptyIndex"))}</div>`;
    return;
  }
  $("modList").innerHTML = shown.map(modRow).join("");
  document.querySelectorAll(".mod-head").forEach((b) => (b.onclick = () => {
    const uid = b.parentElement.dataset.uid;
    if (state.open.has(uid)) state.open.delete(uid); else state.open.add(uid);
    renderCatalog();
  }));
  document.querySelectorAll("[data-remove]").forEach((b) => (b.onclick = () => removeMod(b.dataset.remove)));
  renderActions();
}

function modRow(m) {
  const open = state.open.has(m.uid);
  const name = modName(m);
  const dl = m.download || {};
  const man = m.manifest || {};
  const meta = [m.id, m.category || "—", bytes(dl.size)].map(esc).join(" · ");
  let body = "";
  if (open) {
    body = `<div class="mod-body">
      ${m.summary ? `<p>${esc(m.summary)}</p>` : ""}
      ${kv([
        [t("f.uid"), esc(m.uid), m.uid],
        [t("f.id"), esc(m.id)],
        [t("f.version"), esc(m.version)],
        [t("f.authors"), esc(m.authors || "—")],
        [t("f.category"), esc(m.category || "—")],
        [t("f.downloads"), esc(m.downloads != null ? num(m.downloads) : "—")],
        [t("f.featured"), m.featured ? `<span class="warn-t">${esc(t("yes"))}</span>` : esc(t("no"))],
        [t("f.size"), `${esc(bytes(dl.size))} <span class="faint">(${esc(num(dl.size))} B)</span>`],
        [t("f.sha"), esc(dl.sha256 || "—"), dl.sha256],
        [t("f.tag"), esc(m.tag || "—")],
        [t("f.asset"), esc(m.asset || "—")],
        [t("f.bl"), esc(man.blVersion ?? 1)],
        [t("f.game"), esc(gameRange(man.gameVersion))],
        [t("f.license"), esc(man.license || "—")],
        [t("f.updated"), esc(man.updated || "—")],
        [t("f.deps"), esc(depList(man.dependencies))],
        [t("f.store"), esc(((m.files || []).join(", ")) || "—")],
      ])}
      <div class="actions">
        <button class="btn danger small" data-action="write" data-remove="${esc(m.uid)}">${ICON.trash}${esc(t("act.remove"))}</button>
      </div>
    </div>`;
  }
  return `<article class="mod ${open ? "open" : ""}" data-uid="${esc(m.uid)}">
    <button class="mod-head">
      ${iconHtml(m.icon, name)}
      <div class="mod-main">
        <div class="mod-name">${m.featured ? ICON.star : ""}<span class="n">${esc(name)}</span><span class="ver mono">v${esc(m.version)}</span></div>
        <div class="mod-meta mono">${meta}</div>
      </div>
      ${m.downloads != null ? `<span class="mod-side mono">${ICON.dl}${esc(num(m.downloads))}</span>` : ""}
      ${ICON.chev}
    </button>
    ${body}
  </article>`;
}

function renderReport() {
  const c = state.upload;
  if (!c) { $("report").innerHTML = ""; return; }
  const man = c.manifest || {};
  const pub = c.published;
  const canPublish = c.status === "new" || c.status === "newer";
  const row = (label, local, published) => {
    const diff = published !== undefined && published !== null && String(local) !== String(published);
    return `<tr><td>${esc(label)}</td><td class="${diff ? "diff" : ""}">${esc(local ?? "—")}</td><td>${esc(published ?? "—")}</td></tr>`;
  };
  const warns = c.warnings || [];
  $("report").innerHTML = `
    <div class="card">
      <div class="rep-head">
        ${iconHtml(c.icon, c.name)}
        <div style="flex:1;min-width:0">
          <div class="nm">${esc(c.name)} <span class="mono" style="color:var(--accent)">v${esc(c.version)}</span></div>
          <div class="mono muted">${esc(c.file)} · ${esc(bytes(c.size))}</div>
        </div>
        <span class="badge ${esc(c.status)}">${esc(t("pub.status." + c.status))}</span>
      </div>
      <div class="rep-note">${esc(t("pub.note." + c.status, { pub: pub && pub.version }))}</div>
    </div>
    <div class="card">
      <div class="card-h"><span class="grow lbl">${esc(t("pub.compare"))}</span></div>
      <div class="card-b">
        <table class="cmp">
          <tr><th>${esc(t("col.field"))}</th><th>${esc(t("col.local"))}</th><th>${esc(t("col.published"))}</th></tr>
          ${row(t("f.version"), c.version, pub && pub.version)}
          ${row(t("f.size"), num(c.size) + " B", pub && pub.size != null ? num(pub.size) + " B" : null)}
          ${row(t("f.sha"), c.sha256, pub && pub.sha256)}
        </table>
      </div>
    </div>
    <div class="card">
      <div class="card-h"><span class="grow lbl">${esc(t("pub.package"))}</span></div>
      <div class="card-b">
        ${kv([
          [t("f.uid"), esc(c.uid), c.uid],
          [t("f.id"), esc(c.id)],
          [t("f.authors"), esc(c.authors || "—")],
          [t("f.category"), esc(c.category || "—")],
          c.summary ? [t("f.summary"), esc(c.summary)] : null,
          [t("f.tag"), esc(c.tag)],
          [t("f.asset"), esc(c.asset)],
          [t("f.bl"), esc(man.blVersion ?? 1)],
          [t("f.game"), esc(gameRange(man.gameVersion))],
          [t("f.type"), esc(man.type || "mod")],
          [t("f.entry"), esc(man.type ? "—" : "content/" + (man.entry || "main.js"))],
          [t("f.license"), esc(man.license || "—")],
          [t("f.deps"), esc(depList(man.dependencies))],
          [t("f.entries"), esc(num(c.entries))],
          [t("f.scripts"), esc(num(c.scripts))],
          [t("f.images"), esc(num(c.images))],
        ])}
      </div>
    </div>
    <div class="card">
      <div class="card-h"><span class="grow lbl">${esc(t("pub.warnings"))}</span><span class="count ${warns.length ? "err" : ""}">${warns.length}</span></div>
      <div class="card-b">
        ${warns.length ? `<ul class="warns">${warns.map((w) => `<li>${ICON.warn}<span>${esc(w)}</span></li>`).join("")}</ul>`
          : `<span class="ok-t">${esc(t("pub.noWarnings"))}</span>`}
      </div>
    </div>
    <div class="card">
      <div class="card-h"><span class="grow lbl">${esc(t("pub.storeFiles"))}</span><span class="count">${(c.store || []).length}</span></div>
      <div class="card-b"><ul class="files">${(c.store || []).map((f) => `<li>${esc(f)}</li>`).join("")}</ul></div>
    </div>
    <div class="card"><div class="card-b">
      ${canWrite() ? "" : `<p class="note warn-t">${esc(t("pub.needKey"))}</p>`}
      <div class="actions">
        <button class="btn" id="discardUpload" data-action>${ICON.x}${esc(t("act.discard"))}</button>
        <button class="btn" id="dryUpload" data-action="write">${ICON.dry}${esc(t("act.dry"))}</button>
        ${canPublish ? `<button class="btn primary" id="publishUpload" data-action="write">${ICON.send}${esc(t("act.publish"))}</button>` : ""}
      </div>
    </div></div>`;
  $("discardUpload").onclick = () => { state.upload = null; renderReport(); };
  $("dryUpload").onclick = () => task(t("op.dry", c), "/api/publish-dry", { file: c.file });
  if (canPublish) $("publishUpload").onclick = async () => {
    const r = await task(t("op.publish", c), "/api/publish-upload", { file: c.file });
    if (r.ok) {
      state.upload = null;
      await refresh();
      setTab("catalog");
    }
  };
  renderActions();
}

function renderLog() {
  const fails = state.log.filter((e) => !e.ok).length;
  const count = $("countConsole");
  count.textContent = state.log.length;
  count.classList.toggle("err", fails > 0);
  if (!state.log.length) { $("logList").innerHTML = `<div class="empty">${esc(t("con.empty"))}</div>`; return; }
  $("logList").innerHTML = state.log.map((e) => {
    const out = esc(e.log) + (e.ok ? "" : (e.log ? "\n" : "") + `<span class="e">${esc(t("con.error"))}: ${esc(e.error)}</span>`);
    return `<div class="log-entry">
      <div class="log-head"><span class="dot ${e.ok ? "ok" : "err"}"></span><span class="log-title">${esc(e.title)}</span>
        <span class="log-meta mono">${esc(clock(e.at))} · ${esc(e.ms)} ms</span></div>
      <pre class="log">${out || `<span class="faint">${esc(t("con.noOutput"))}</span>`}</pre>
    </div>`;
  }).join("");
}

function renderLast() {
  const e = state.log[0];
  let dot = "", txt = t("last.ready"), meta = "";
  if (state.running) { dot = "info"; txt = t("last.running", { title: state.running }); }
  else if (e) { dot = e.ok ? "ok" : "err"; txt = t(e.ok ? "last.ok" : "last.fail", { title: e.title }); meta = `${e.ms} ms`; }
  $("lastDot").className = "dot " + dot;
  $("lastTxt").textContent = txt;
  $("lastMeta").textContent = meta;
}

function renderSystem() {
  const d = state.data;
  if (!d) { $("sysInfo").innerHTML = `<div class="empty">—</div>`; return; }
  const a = d.app, r = d.remote, n = d.traffic, c = d.credential || {};
  const [keyCls, keyTxt] = credentialView(c);
  const card = (title, body) => `<div class="card"><div class="card-h"><span class="grow lbl">${esc(title)}</span></div><div class="card-b">${body}</div></div>`;
  const reset = n.quotaReset ? clock(n.quotaReset * 1000) : "—";
  $("sysInfo").innerHTML =
    card(t("sys.key"), kv([
      [t("sys.status"), `<span class="${keyCls}-t">${esc(keyTxt)}</span>${c.error ? ` <span class="faint">${esc(c.error)}</span>` : ""}`],
      [t("sys.account"), esc(c.login || "—")],
      [t("sys.write"), c.push === undefined ? "—" : `<span class="${c.push ? "ok" : "err"}-t">${esc(t(c.push ? "yes" : "no"))}</span>`],
      [t("sys.checked"), esc(clock(c.checkedAt))],
    ])) +
    card(t("sys.index"), kv([
      [t("sys.source"), esc(t(r.source === "api" ? "sys.src.api" : "sys.src.public"))],
      [t("sys.repo"), esc(c.repo || "—")],
      [t("sys.branch"), esc(r.branch)],
      [t("sys.commit"), esc(r.commit || "—"), r.commit],
      [t("sys.commitDate"), esc(r.commitDate ? new Date(r.commitDate).toLocaleString(locale(), { hour12: false }) : "—")],
      [t("sys.tree"), esc(r.tree || "—"), r.tree],
      [t("sys.files"), esc(num(r.files))],
      [t("sys.indexFormat"), esc(r.format ?? "—")],
      [t("sys.indexSize"), esc(bytes(r.indexBytes))],
      [t("sys.loadTime"), esc(r.loadMs + " ms")],
      [t("sys.fetched"), esc(clock(r.fetchedAt))],
      [t("sys.downloads"), esc(num(d.stats && d.stats.total))],
      [t("sys.statsAt"), esc(d.stats && d.stats.updatedAt ? new Date(d.stats.updatedAt).toLocaleString(locale(), { hour12: false }) : "—")],
    ])) +
    card(t("sys.net"), kv([
      [t("sys.requests"), esc(num(n.requests))],
      [t("sys.sent"), esc(bytes(n.sent))],
      [t("sys.received"), esc(bytes(n.received))],
      [t("sys.latency"), esc(n.latencyMs >= 0 ? n.latencyMs + " ms" : "—")],
      [t("sys.quota"), esc(n.quotaLimit > 0 ? `${num(n.quotaRemaining)} / ${num(n.quotaLimit)}` : "—")],
      [t("sys.reset"), esc(reset)],
    ])) +
    card(t("sys.app"), kv([
      [t("sys.version"), esc(a.version)],
      [t("sys.build"), esc(a.build)],
      [t("sys.format"), esc("blVersion " + a.blVersion)],
      [t("sys.device"), esc(a.device)],
      [t("sys.android"), esc(a.android)],
      [t("sys.lang"), esc(t("lang." + lang))],
    ]));
}

// ------------------------------------------------------------ ações
function setTab(tab) {
  state.tab = tab;
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  document.querySelectorAll("main > section").forEach((s) => (s.hidden = s.id !== "tab-" + tab));
  window.scrollTo(0, 0);
}

function confirmBox(title, body, info, yes) {
  const d = $("confirm");
  $("cfTitle").textContent = title;
  $("cfBody").textContent = body;
  $("cfInfo").innerHTML = info;
  $("cfYes").textContent = yes;
  return new Promise((resolve) => {
    $("cfYes").onclick = () => { d.close(); resolve(true); };
    $("cfNo").onclick = () => { d.close(); resolve(false); };
    d.oncancel = () => resolve(false);
    d.showModal();
  });
}

async function removeMod(uid) {
  const m = ((state.data && state.data.catalog) || []).find((x) => x.uid === uid);
  if (!m) return;
  const name = modName(m);
  const info = kv([[t("f.uid"), esc(m.uid)], [t("f.version"), esc(m.version)], [t("f.tag"), esc(m.tag || "—")]]).replace(/^<dl class="kv">|<\/dl>$/g, "");
  if (!(await confirmBox(t("rm.title", { name }), t("rm.body"), info, t("rm.confirm")))) return;
  const r = await task(t("op.remove", { name }), "/api/remove", { uid });
  if (r.ok) {
    state.open.delete(uid);
    await refresh();
  }
}

async function upload(file) {
  setTab("publish");
  let data;
  try {
    data = await fileBase64(file);
  } catch (e) {
    data = "";
  }
  const r = await task(t("op.check", { file: file.name }), "/api/upload", { name: file.name, data });
  state.upload = r.ok ? r.result : null;
  renderReport();
  if (!r.ok) setTab("console");
}

document.querySelectorAll("#tabs button").forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));
document.querySelectorAll("#langSeg button").forEach((b) => (b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("bl.lang", lang); } catch { /* sem armazenamento: vale só nesta abertura */ }
  render();
}));
$("syncBtn").onclick = async () => {
  const r = await task(t("op.sync"), "/api/sync");
  if (r.ok) await refresh();
};
$("search").oninput = (e) => { state.filter = e.target.value; renderCatalog(); };
$("sort").onchange = (e) => { state.sort = e.target.value; renderCatalog(); };
$("file").onchange = (e) => { const f = e.target.files[0]; e.target.value = ""; if (f) upload(f); };
$("clearLog").onclick = () => { state.log = []; renderLog(); renderLast(); };
$("last").onclick = () => setTab("console");
setInterval(() => {
  const el = $("syncAgo");
  if (el && state.data) el.textContent = ago(state.data.remote.fetchedAt);
}, 5000);

setTab("catalog");
render();
refresh();
</script>
</body>
</html>
